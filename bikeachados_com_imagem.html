<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BikeAchados</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
    color: #222;
}

header {
    background: #ff5722;
    color: white;
    padding: 18px 15px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 15px;
}

.logo span {
    color: #ffe082;
}

.search {
    background: white;
    border-radius: 9px;
    padding: 12px;
}

.search input {
    width: 100%;
    border: 0;
    outline: 0;
    font-size: 15px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.banner {
    background: linear-gradient(135deg, #ff5722, #ff7043);
    color: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.banner h1 {
    font-size: 26px;
    margin-bottom: 8px;
}

.titulo {
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0 12px;
}

.produtos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.produto {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 8px #0002;
}

.produto img {
    width: 100%;
    height: 240px;
    object-fit: contain;
    background: white;
    display: block;
}

.info {
    padding: 13px;
}

.info h2 {
    font-size: 17px;
    margin-bottom: 8px;
}

.estrelas {
    color: #ff9800;
    margin-bottom: 8px;
}

.antigo {
    font-size: 13px;
    color: #999;
    text-decoration: line-through;
}

.preco {
    font-size: 23px;
    font-weight: bold;
    color: #ff5722;
    margin: 4px 0 12px;
}

.botao {
    display: block;
    background: #ff5722;
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
}

footer {
    margin-top: 30px;
    background: #222;
    color: #aaa;
    text-align: center;
    padding: 25px;
}

@media (max-width: 500px) {
    .produtos {
        grid-template-columns: 1fr;
    }

    .produto img {
        height: 280px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🚲 Bike<span>Achados</span></div>

    <div class="search">
        <input id="busca"
               type="text"
               placeholder="🔎 Buscar achadinhos de bike...">
    </div>
</header>

<div class="container">

        <h1>🔥 Achadinho do dia</h1>

    </div>

    <div class="titulo">
        🚲 Produto em destaque
